<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TeamCal v1</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif}
body{background:#f8f9fa;min-height:100vh;padding:20px}
.app{background:#fff;border-radius:12px;border:1px solid #dadce0;overflow:hidden;max-width:1100px;margin:0 auto;box-shadow:0 1px 6px rgba(0,0,0,.08)}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid #dadce0;flex-wrap:wrap}
.logo{font-size:20px;font-weight:600;color:#202124;letter-spacing:-.5px}.logo span{color:#1a73e8}
.version{font-size:11px;color:#80868b;align-self:flex-end;margin-bottom:2px}
.spacer{flex:1}
.add-btn{background:#1a73e8;color:#fff;border:none;border-radius:20px;padding:8px 18px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;font-weight:500}
.add-btn:hover{background:#1557b0}
.tab-bar{display:flex;border-bottom:1px solid #dadce0}
.tab{padding:12px 24px;font-size:14px;cursor:pointer;color:#5f6368;border-bottom:2px solid transparent;display:flex;align-items:center;gap:7px;transition:all .15s}
.tab:hover{color:#202124;background:#f8f9fa}
.tab.active{color:#1a73e8;border-bottom-color:#1a73e8;font-weight:500}
.panel{display:none}.panel.active{display:block}
.cal-main{display:flex}
.sidebar{width:190px;border-right:1px solid #dadce0;padding:12px 10px;flex-shrink:0}
.sid-ctrl{display:flex;align-items:center;gap:4px;padding:4px 6px;margin-bottom:6px}
.sid-nav{background:none;border:none;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:18px;color:#5f6368;display:flex;align-items:center;justify-content:center}
.sid-nav:hover{background:#f1f3f4}
.sid-month{font-size:14px;font-weight:500;color:#202124;flex:1;text-align:center}
.today-btn{width:100%;background:none;border:1px solid #dadce0;border-radius:6px;padding:5px;font-size:12px;color:#202124;cursor:pointer;margin-bottom:10px}
.today-btn:hover{background:#f1f3f4}
.sidebar-sec{font-size:11px;font-weight:500;color:#80868b;letter-spacing:.8px;margin:12px 0 5px 6px}
.member-item{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;margin-bottom:1px}
.avatar{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#fff;flex-shrink:0}
.member-name{font-size:13px;color:#202124}
.legend-item{display:flex;align-items:center;gap:8px;padding:3px 8px;font-size:12px;color:#5f6368}
.legend-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.cal-wrap{flex:1;overflow:auto}
.cal-header{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid #dadce0}
.cal-header div{text-align:center;padding:9px 0;font-size:12px;font-weight:500;color:#5f6368}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.day-cell{border-right:.5px solid #dadce0;border-bottom:.5px solid #dadce0;min-height:90px;padding:4px}
.day-cell:nth-child(7n){border-right:none}
.day-num{font-size:12px;color:#5f6368;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%;margin-bottom:2px}
.day-num.today{background:#1a73e8 !important;color:#fff !important;font-weight:500}
.day-num.other-month{opacity:.3}
.day-num.sun,.day-num.holiday{color:#e53935 !important}
.day-num.sat{color:#1a73e8 !important}
.other-month-cell{opacity:.5}
.event-pill{font-size:11px;padding:2px 7px;border-radius:10px;margin-bottom:2px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.event-pill:hover{filter:brightness(.9)}
.task-toolbar{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid #dadce0;flex-wrap:wrap}
.filter-select{border:1px solid #dadce0;border-radius:6px;padding:6px 10px;font-size:13px;color:#202124;background:#fff;cursor:pointer;outline:none}
.filter-select:focus{border-color:#1a73e8}
.st-tabs{display:flex;gap:6px}
.st-tab{padding:5px 14px;border-radius:16px;font-size:12px;cursor:pointer;border:1px solid #dadce0;color:#5f6368;background:none}
.st-tab.active{background:#1a73e8;color:#fff;border-color:#1a73e8}
.task-list{padding:16px 20px;display:flex;flex-direction:column;gap:8px;min-height:300px}
.task-card{background:#fff;border:1px solid #e0e0e0;border-left:3px solid #e0e0e0;border-radius:10px;padding:14px 16px;cursor:pointer;transition:border-color .15s}
.task-card:hover{border-color:#bbb;border-left-color:inherit}
.task-card.priority-high{border-left-color:#ea4335}
.task-card.priority-mid{border-left-color:#fbbc04}
.task-card.priority-low{border-left-color:#34a853}
.task-card.done-card{opacity:.55}
.task-top{display:flex;align-items:flex-start;gap:10px}
.task-check{width:18px;height:18px;border-radius:50%;border:2px solid #bbb;flex-shrink:0;margin-top:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.task-check.checked{background:#1a73e8;border-color:#1a73e8}
.task-check.checked::after{content:'✓';color:#fff;font-size:11px;font-weight:700}
.task-title{font-size:14px;font-weight:500;color:#202124;flex:1;line-height:1.4}
.task-title.done-text{text-decoration:line-through;color:#9aa0a6}
.task-meta{display:flex;align-items:center;gap:7px;margin-top:9px;flex-wrap:wrap}
.task-badge{font-size:11px;padding:2px 9px;border-radius:10px;font-weight:500}
.badge-due{background:#fce8e6;color:#c5221f}
.badge-due.ok{background:#e6f4ea;color:#137333}
.badge-cat{background:#e8f0fe;color:#1a73e8}
.badge-pri-high{background:#fce8e6;color:#c5221f}
.badge-pri-mid{background:#fef7e0;color:#b06000}
.badge-pri-low{background:#e6f4ea;color:#137333}
.assignees{display:flex;margin-left:auto}
.ass-av{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;color:#fff;border:2px solid #fff;margin-left:-5px}
.empty-state{text-align:center;padding:60px 20px;color:#9aa0a6;font-size:14px}
.members-panel{padding:20px}
.members-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.member-card{background:#fff;border:1px solid #e0e0e0;border-radius:10px;padding:14px 16px;display:flex;align-items:center;gap:12px}
.av-lg{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#fff;flex-shrink:0}
.member-info{flex:1;min-width:0}
.member-info .mn{font-size:14px;font-weight:500;color:#202124}
.member-info .mr{font-size:12px;color:#5f6368;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-action{background:none;border:none;color:#9aa0a6;cursor:pointer;padding:4px;border-radius:4px;font-size:15px;line-height:1}
.icon-action:hover{background:#f1f3f4;color:#202124}
.icon-action.danger:hover{color:#ea4335;background:#fce8e6}
.add-member-card{border:1.5px dashed #dadce0;border-radius:10px;padding:14px 16px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;color:#1a73e8;font-size:13px;font-weight:500}
.add-member-card:hover{background:#f8f9fa}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:14px;padding:24px;width:380px;max-width:96vw;box-shadow:0 8px 40px rgba(0,0,0,.18)}
.modal h3{font-size:15px;font-weight:600;margin-bottom:18px;color:#202124}
.fg{margin-bottom:13px}
.fg label{display:block;font-size:12px;color:#5f6368;margin-bottom:4px;font-weight:500}
.fg input,.fg select,.fg textarea{width:100%;padding:9px 11px;border:1px solid #dadce0;border-radius:7px;font-size:13px;color:#202124;background:#fff;outline:none;font-family:inherit}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:#1a73e8;box-shadow:0 0 0 2px #e8f0fe}
.fg textarea{resize:vertical;min-height:60px}
.fg-row{display:flex;gap:10px}.fg-row .fg{flex:1}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.btn-cancel{background:none;border:none;padding:8px 14px;font-size:13px;color:#1a73e8;cursor:pointer;border-radius:7px;font-weight:500}
.btn-cancel:hover{background:#e8f0fe}
.btn-save{background:#1a73e8;color:#fff;border:none;padding:9px 20px;font-size:13px;border-radius:7px;cursor:pointer;font-weight:500}
.btn-save:hover{background:#1557b0}
.btn-danger{background:#ea4335;color:#fff;border:none;padding:9px 16px;font-size:13px;border-radius:7px;cursor:pointer;font-weight:500}
.btn-danger:hover{background:#c5221f}
.color-swatches{display:flex;gap:8px;flex-wrap:wrap;padding:4px 0}
.swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:border-color .15s,transform .1s}
.swatch:hover{transform:scale(1.15)}
.swatch.sel{border-color:#202124;transform:scale(1.1)}
.multi-sel{display:flex;flex-wrap:wrap;gap:6px}
.ms-chip{padding:5px 12px;border-radius:14px;font-size:12px;cursor:pointer;border:1px solid #dadce0;color:#5f6368;background:none;transition:all .15s;font-weight:500}
.ms-chip.sel{background:#1a73e8;color:#fff;border-color:#1a73e8}
@media(max-width:640px){body{padding:8px}.cal-main{flex-direction:column}.sidebar{width:100%;border-right:none;border-bottom:1px solid #dadce0}.members-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div><div class="logo">Team<span>Cal</span></div></div>
    <span class="version">v1.0</span>
    <div class="spacer"></div>
    <button class="add-btn" id="main-add-btn" onclick="mainAdd()">+ <span id="add-label">일정 추가</span></button>
  </div>
  <div class="tab-bar">
    <div class="tab active" onclick="switchTab('cal',this)">📅 일정</div>
    <div class="tab" onclick="switchTab('task',this)">✅ Task</div>
    <div class="tab" onclick="switchTab('members',this)">👥 팀원 관리</div>
  </div>

  <div class="panel active" id="panel-cal">
    <div class="cal-main">
      <div class="sidebar">
        <div class="sid-ctrl">
          <button class="sid-nav" onclick="changeMonth(-1)">&#8249;</button>
          <span class="sid-month" id="month-title"></span>
          <button class="sid-nav" onclick="changeMonth(1)">&#8250;</button>
        </div>
        <button class="today-btn" onclick="goToday()">오늘</button>
        <div class="sidebar-sec">팀원</div>
        <div id="sidebar-members"></div>
      </div>
      <div class="cal-wrap">
        <div class="cal-header">
          <div style="color:#e53935">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div style="color:#1a73e8">토</div>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>
    </div>
  </div>

  <div class="panel" id="panel-task">
    <div class="task-toolbar">
      <select class="filter-select" id="task-filter-member" onchange="renderTasks()"><option value="">전체 팀원</option></select>
      <select class="filter-select" id="task-filter-cat" onchange="renderTasks()">
        <option value="">전체 카테고리</option>
        <option>월마감</option><option>결산</option><option>세무</option><option>감사</option><option>보고</option><option>기타</option>
      </select>
      <div class="st-tabs">
        <button class="st-tab active" onclick="setStFilter('all',this)">전체</button>
        <button class="st-tab" onclick="setStFilter('todo',this)">진행</button>
        <button class="st-tab" onclick="setStFilter('done',this)">완료</button>
      </div>
    </div>
    <div class="task-list" id="task-list"></div>
  </div>

  <div class="panel" id="panel-members">
    <div class="members-panel">
      <div class="members-grid" id="members-grid"></div>
    </div>
  </div>
</div>

<!-- MODALS -->
<div class="modal-overlay" id="modal-sched">
  <div class="modal">
    <h3>일정 추가</h3>
    <div class="fg"><label>팀원</label><select id="s-member"></select></div>
    <div class="fg"><label>유형</label>
      <select id="s-type"><option>휴가</option><option>교육</option><option>출장</option><option>기타</option></select>
    </div>
    <div class="fg-row">
      <div class="fg"><label>시작일</label><input type="date" id="s-start"></div>
      <div class="fg"><label>종료일</label><input type="date" id="s-end"></div>
    </div>
    <div class="fg"><label>메모</label><input type="text" id="s-memo" placeholder="예: 연차, AWS 교육"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('modal-sched')">취소</button>
      <button class="btn-save" onclick="saveSched()">저장</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-sdetail">
  <div class="modal">
    <div id="sd-content"></div>
    <div class="modal-actions">
      <button class="btn-danger" onclick="deleteSched()">삭제</button>
      <button class="btn-cancel" onclick="closeModal('modal-sdetail')">닫기</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-task">
  <div class="modal">
    <h3>Task 추가</h3>
    <div class="fg"><label>제목</label><input type="text" id="t-title" placeholder="예: 3월 월마감 B/S 검토"></div>
    <div class="fg-row">
      <div class="fg"><label>카테고리</label>
        <select id="t-cat"><option>월마감</option><option>결산</option><option>세무</option><option>감사</option><option>보고</option><option>기타</option></select>
      </div>
      <div class="fg"><label>우선순위</label>
        <select id="t-pri"><option value="high">높음</option><option value="mid" selected>중간</option><option value="low">낮음</option></select>
      </div>
    </div>
    <div class="fg"><label>데드라인</label><input type="date" id="t-due"></div>
    <div class="fg"><label>담당자 (복수 선택)</label><div class="multi-sel" id="t-assignees"></div></div>
    <div class="fg"><label>메모</label><textarea id="t-memo" placeholder="세부 내용을 입력하세요"></textarea></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('modal-task')">취소</button>
      <button class="btn-save" onclick="saveSched_task()">저장</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-tdetail">
  <div class="modal">
    <div id="td-content"></div>
    <div class="modal-actions">
      <button class="btn-danger" onclick="deleteTask()">삭제</button>
      <button class="btn-cancel" onclick="closeModal('modal-tdetail')">닫기</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-member">
  <div class="modal">
    <h3 id="mm-title">팀원 추가</h3>
    <div class="fg"><label>이름</label><input type="text" id="mm-name" placeholder="예: 윤찬호"></div>
    <div class="fg"><label>직책</label><input type="text" id="mm-role" placeholder="예: 회계팀 대리"></div>
    <div class="fg"><label>색상</label><div class="color-swatches" id="mm-swatches"></div></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('modal-member')">취소</button>
      <button class="btn-save" onclick="saveMember()">저장</button>
    </div>
  </div>
</div>

<script>
/* ===== SUPABASE ===== */
const SB_URL='https://bcxvunprnbhhvgpbajvp.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJjeHZ1bnBybmJoaHZncGJhanZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzOTEzMzMsImV4cCI6MjA5Mzk2NzMzM30.NtXnwMyV3afOi2a7jtpykBal-kKGMV1PagYJpibmmWY';
const SBH={'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY};

async function sbGet(tbl){
  const r=await fetch(SB_URL+'/rest/v1/'+tbl+'?order=id',{headers:{...SBH,'Prefer':'return=representation'}});
  if(!r.ok)throw new Error(await r.text());
  return r.json();
}
async function sbPost(tbl,body){
  const r=await fetch(SB_URL+'/rest/v1/'+tbl,{method:'POST',headers:{...SBH,'Prefer':'return=representation'},body:JSON.stringify(body)});
  if(!r.ok)throw new Error(await r.text());
  return r.json();
}
async function sbPatch(tbl,id,body){
  const r=await fetch(SB_URL+'/rest/v1/'+tbl+'?id=eq.'+id,{method:'PATCH',headers:{...SBH,'Prefer':'return=representation'},body:JSON.stringify(body)});
  if(!r.ok)throw new Error(await r.text());
  return r.json();
}
async function sbDel(tbl,id){
  const r=await fetch(SB_URL+'/rest/v1/'+tbl+'?id=eq.'+id,{method:'DELETE',headers:SBH});
  if(!r.ok)throw new Error(await r.text());
}

/* ===== STATUS TOAST ===== */
function setStatus(msg,type){
  let el=document.getElementById('sb-toast');
  if(!el){el=document.createElement('div');el.id='sb-toast';el.style.cssText='position:fixed;bottom:16px;right:16px;padding:9px 16px;border-radius:8px;font-size:13px;font-weight:500;z-index:999;transition:opacity .4s';document.body.appendChild(el);}
  el.style.opacity='1';
  const cfg={ok:['#e6f4ea','#137333','#ceead6'],err:['#fce8e6','#c5221f','#f5c6c6'],info:['#e8f0fe','#1a73e8','#c5d8fb']};
  const [bg,color,border]=(cfg[type]||cfg.info);
  Object.assign(el.style,{background:bg,color,border:'1px solid '+border});
  el.textContent=msg;
  if(type!=='info')setTimeout(()=>el.style.opacity='0',2500);
}

/* ===== CONSTANTS ===== */
const HOLIDAYS={'2026-01-01':'신정','2026-02-16':'설날 연휴','2026-02-17':'설날','2026-02-18':'설날 연휴','2026-03-01':'삼일절','2026-03-02':'대체공휴일','2026-05-05':'어린이날','2026-05-24':'부처님오신날','2026-05-25':'대체공휴일','2026-06-03':'지방선거','2026-06-06':'현충일','2026-07-17':'제헌절','2026-08-15':'광복절','2026-08-17':'대체공휴일','2026-09-24':'추석 연휴','2026-09-25':'추석','2026-09-26':'추석 연휴','2026-10-03':'개천절','2026-10-05':'대체공휴일','2026-10-09':'한글날','2026-12-25':'크리스마스'};
const COLORS=['#1a73e8','#e91e63','#9c27b0','#ff9800','#00897b','#f44336','#607d8b','#795548','#0097a7','#388e3c'];
const TYPE_COLOR={휴가:'#fbbc04',교육:'#34a853',출장:'#4285f4',기타:'#ea4335'};
const TYPE_TEXT={휴가:'#7a5a00',교육:'#1a5c2e',출장:'#1a3f7a',기타:'#7a1f1a'};
const PRI_LABEL={high:'높음',mid:'중간',low:'낮음'};
const DEFAULT_MEMBERS=[
  {name:'윤찬호',role:'회계팀',color:'#1a73e8'},{name:'김한솔',role:'회계팀',color:'#e91e63'},
  {name:'차원진',role:'회계팀',color:'#9c27b0'},{name:'이승우',role:'회계팀',color:'#ff9800'},
  {name:'오민지',role:'회계팀',color:'#00897b'},{name:'채성민',role:'회계팀',color:'#f44336'},
  {name:'조예진',role:'회계팀',color:'#607d8b'},
];

/* ===== STATE ===== */
let members=[],schedules=[],tasks=[];
let curYear,curMonth,curTab='cal';
const today=new Date();
let editMemberIdx=null,selSchedIdx=null,selTaskIdx=null,stFilter='all',mmSelColor=COLORS[0],selAssignees=[];

/* ===== UTILS ===== */
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtDate(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function p2(n){return String(n).padStart(2,'0')}
function daysDiff(a,b){return Math.ceil((new Date(b)-new Date(a))/86400000)}
function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
document.querySelectorAll('.modal-overlay').forEach(o=>o.addEventListener('click',function(e){if(e.target===this)this.classList.remove('open');}));

/* ===== INIT ===== */
async function initData(){
  curYear=today.getFullYear();curMonth=today.getMonth();
  setStatus('데이터 불러오는 중…','info');
  try{
    const [mRaw,sRaw,tRaw]=await Promise.all([sbGet('members'),sbGet('schedules'),sbGet('tasks')]);
    if(mRaw.length===0){
      const ins=await sbPost('members',DEFAULT_MEMBERS);
      members=ins.map(parseMember);
    }else{
      members=mRaw.map(parseMember);
    }
    schedules=sRaw.map(parseSched);
    tasks=tRaw.map(parseTask);
    setStatus('✓ 동기화 완료','ok');
  }catch(e){setStatus('연결 오류: '+e.message,'err');}
}
function parseMember(m){return {id:m.id,name:m.name,role:m.role||'',color:m.color||'#1a73e8'};}
function parseSched(s){return {id:s.id,memberId:s.member_id,type:s.type,start:s.start_date,end:s.end_date,memo:s.memo||''};}
function parseTask(t){
  let assignees=[];
  try{assignees=JSON.parse(t.assignees||'[]');}catch(e){}
  return {id:t.id,title:t.title,cat:t.cat,pri:t.pri,due:t.due_date,assignees,memo:t.memo||'',done:!!t.done};
}

/* ===== TAB ===== */
function switchTab(t,el){
  curTab=t;
  document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.panel').forEach(e=>e.classList.remove('active'));
  document.getElementById('panel-'+t).classList.add('active');
  document.getElementById('add-label').textContent={cal:'일정 추가',task:'Task 추가',members:'팀원 추가'}[t];
  if(t==='cal'){renderSidebar();renderCal();}
  if(t==='task'){renderTaskFilters();renderTasks();}
  if(t==='members')renderMembersPanel();
}
function mainAdd(){
  if(curTab==='cal')openSchedModal();
  else if(curTab==='task')openTaskModal();
  else openMemberModal(null);
}

/* ===== SIDEBAR ===== */
function renderSidebar(){
  document.getElementById('sidebar-members').innerHTML=members.map(m=>`
    <div class="member-item">
      <div class="avatar" style="background:${m.color}">${esc(m.name[0])}</div>
      <span class="member-name">${esc(m.name)}</span>
    </div>`).join('');
}

/* ===== CALENDAR ===== */
function renderCal(){
  document.getElementById('month-title').textContent=curYear+'.'+p2(curMonth+1);
  const grid=document.getElementById('cal-grid');
  const first=new Date(curYear,curMonth,1);
  const last=new Date(curYear,curMonth+1,0);
  const sd=first.getDay();
  const cells=[];
  for(let i=0;i<sd;i++)cells.push({date:fmtDate(new Date(curYear,curMonth,1-sd+i)),cur:false});
  for(let d=1;d<=last.getDate();d++)cells.push({date:fmtDate(new Date(curYear,curMonth,d)),cur:true});
  const rem=7-cells.length%7;
  if(rem<7)for(let i=1;i<=rem;i++)cells.push({date:fmtDate(new Date(curYear,curMonth+1,i)),cur:false});
  grid.innerHTML=cells.map(c=>{
    const isT=c.date===fmtDate(today);
    const dn=+c.date.split('-')[2];
    const dow=new Date(c.date).getDay();
    let dayClass='';
    let holidayLabel='';
    if(HOLIDAYS[c.date]){
      dayClass=' holiday';
      if(c.cur)holidayLabel='<div style="font-size:10px;color:#e53935;margin-bottom:2px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+HOLIDAYS[c.date]+'</div>';
    }else if(dow===0){dayClass=' sun';}
    else if(dow===6){dayClass=' sat';}
    const pills=schedules.filter(e=>e.start<=c.date&&e.end>=c.date).map(e=>{
      const idx=schedules.indexOf(e);
      const m=members[e.memberId];
      const bg=m?.color||'#999';
      return '<div class="event-pill" style="background:'+bg+';color:#fff" onclick="showSchedDetail('+idx+')">'+(m?esc(m.name):'?')+' '+esc(e.type)+'</div>';
    }).join('');
    const taskPills=tasks.filter(t=>t.due===c.date).map(t=>{
      const idx=tasks.indexOf(t);
      const ov=!t.done&&t.due<fmtDate(today);
      const bg=t.done?'#e0e0e0':ov?'#fce8e6':'#e8f0fe';
      const cl=t.done?'#9e9e9e':ov?'#c5221f':'#1a73e8';
      const br=t.done?'#bbb':ov?'#f5c6c6':'#c5d8fb';
      return '<div class="event-pill" style="background:'+bg+';color:'+cl+';border:1px solid '+br+'" onclick="showTaskDetail('+idx+')">✦ '+esc(t.title)+'</div>';
    }).join('');
    return '<div class="day-cell'+(c.cur?'':' other-month-cell')+'"><div class="day-num'+(isT?' today':'')+(c.cur?'':' other-month')+dayClass+'">'+dn+'</div>'+holidayLabel+pills+taskPills+'</div>';
  }).join('');
}
function changeMonth(d){curMonth+=d;if(curMonth>11){curMonth=0;curYear++;}else if(curMonth<0){curMonth=11;curYear--;}renderCal();}
function goToday(){curYear=today.getFullYear();curMonth=today.getMonth();renderCal();}

/* ===== SCHEDULE ===== */
function openSchedModal(){
  document.getElementById('s-member').innerHTML=members.map((m,i)=>'<option value="'+i+'">'+esc(m.name)+'</option>').join('');
  document.getElementById('s-start').value=fmtDate(today);
  document.getElementById('s-end').value=fmtDate(today);
  document.getElementById('s-memo').value='';
  openModal('modal-sched');
}
async function saveSched(){
  const memberId=+document.getElementById('s-member').value;
  const type=document.getElementById('s-type').value;
  const start=document.getElementById('s-start').value;
  const end=document.getElementById('s-end').value;
  const memo=document.getElementById('s-memo').value;
  if(!start||!end){alert('날짜를 입력해주세요');return;}
  if(start>end){alert('종료일이 시작일보다 빠릅니다');return;}
  closeModal('modal-sched');
  setStatus('저장 중…','info');
  try{
    const res=await sbPost('schedules',{member_id:memberId,type,start_date:start,end_date:end,memo});
    schedules.push(parseSched(res[0]));
    const [y,mo]=start.split('-');curYear=+y;curMonth=+mo-1;
    renderCal();
    setStatus('✓ 저장됨','ok');
  }catch(e){setStatus('저장 실패: '+e.message,'err');}
}
function showSchedDetail(idx){
  selSchedIdx=idx;
  const e=schedules[idx];
  const m=members[e.memberId];
  document.getElementById('sd-content').innerHTML=
    '<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">'+
    '<div class="av-lg" style="background:'+(m?.color||'#999')+'">'+(m?esc(m.name[0]):'?')+'</div>'+
    '<div><div style="font-size:16px;font-weight:600;color:#202124">'+esc(m?.name||'알 수 없음')+'</div>'+
    '<div style="font-size:12px;color:#5f6368">'+esc(m?.role||'')+'</div></div></div>'+
    '<div style="margin-bottom:12px"><span class="task-badge" style="background:'+TYPE_COLOR[e.type]+';color:'+TYPE_TEXT[e.type]+'">'+esc(e.type)+'</span></div>'+
    '<div style="font-size:13px;color:#5f6368;margin-bottom:6px">📅 '+e.start+(e.start!==e.end?' ~ '+e.end:'')+'</div>'+
    (e.memo?'<div style="font-size:13px;color:#202124;margin-top:10px;background:#f8f9fa;border-radius:7px;padding:10px">'+esc(e.memo)+'</div>':'');
  openModal('modal-sdetail');
}
async function deleteSched(){
  if(selSchedIdx===null)return;
  const id=schedules[selSchedIdx].id;
  closeModal('modal-sdetail');
  setStatus('삭제 중…','info');
  try{
    await sbDel('schedules',id);
    schedules.splice(selSchedIdx,1);
    renderCal();
    setStatus('✓ 삭제됨','ok');
  }catch(e){setStatus('삭제 실패','err');}
}

/* ===== TASK ===== */
function renderTaskFilters(){
  const sel=document.getElementById('task-filter-member');
  const cur=sel.value;
  sel.innerHTML='<option value="">전체 팀원</option>'+members.map((m,i)=>'<option value="'+i+'">'+esc(m.name)+'</option>').join('');
  if(members.some((_,i)=>String(i)===cur))sel.value=cur;
}
function setStFilter(v,btn){stFilter=v;document.querySelectorAll('.st-tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderTasks();}
function renderTasks(){
  const fm=document.getElementById('task-filter-member').value;
  const fc=document.getElementById('task-filter-cat').value;
  const list=tasks.filter(t=>{
    if(fm!==''&&!t.assignees.includes(+fm))return false;
    if(fc!==''&&t.cat!==fc)return false;
    if(stFilter==='todo'&&t.done)return false;
    if(stFilter==='done'&&!t.done)return false;
    return true;
  });
  const el=document.getElementById('task-list');
  if(!list.length){el.innerHTML='<div class="empty-state">☑️<br>해당하는 Task가 없습니다</div>';return;}
  el.innerHTML=list.map(t=>{
    const idx=tasks.indexOf(t);
    const now=fmtDate(today);
    const ov=!t.done&&t.due<now;
    const dl=ov?'D+'+daysDiff(t.due,now):(t.due===now?'D-day':'D-'+daysDiff(now,t.due));
    const asses=t.assignees.map(ai=>'<div class="ass-av" style="background:'+(members[ai]?.color||'#999')+'" title="'+esc(members[ai]?.name||'')+'">'+esc(members[ai]?.name?.[0]||'?')+'</div>').join('');
    return '<div class="task-card priority-'+t.pri+(t.done?' done-card':'')+'" onclick="showTaskDetail('+idx+')">'+
      '<div class="task-top">'+
      '<div class="task-check'+(t.done?' checked':'')+'" onclick="event.stopPropagation();toggleTask('+idx+')"></div>'+
      '<div class="task-title'+(t.done?' done-text':'')+'">'+esc(t.title)+'</div>'+
      '<button onclick="event.stopPropagation();confirmDeleteTask('+idx+')" style="background:none;border:none;cursor:pointer;color:#bbb;padding:2px 4px;border-radius:4px;line-height:1;flex-shrink:0;font-size:16px" onmouseover="this.style.color=\'#ea4335\';this.style.background=\'#fce8e6\'" onmouseout="this.style.color=\'#bbb\';this.style.background=\'none\'">✕</button>'+
      '</div>'+
      '<div class="task-meta">'+
      '<span class="task-badge badge-cat">'+esc(t.cat)+'</span>'+
      '<span class="task-badge badge-pri-'+t.pri+'">'+PRI_LABEL[t.pri]+'</span>'+
      '<span class="task-badge '+(ov?'badge-due':'badge-due ok')+'">'+t.due+' ('+dl+')</span>'+
      '<div class="assignees">'+asses+'</div>'+
      '</div></div>';
  }).join('');
}
async function toggleTask(idx){
  tasks[idx].done=!tasks[idx].done;
  renderTasks();renderCal();
  try{await sbPatch('tasks',tasks[idx].id,{done:tasks[idx].done});}catch(e){}
}
async function confirmDeleteTask(idx){
  if(!confirm('"'+tasks[idx].title+'" Task를 삭제하시겠습니까?'))return;
  const id=tasks[idx].id;
  tasks.splice(idx,1);
  renderTasks();renderCal();
  try{await sbDel('tasks',id);}catch(e){}
}
function showTaskDetail(idx){
  selTaskIdx=idx;
  const t=tasks[idx];
  const now=fmtDate(today);
  const ov=!t.done&&t.due<now;
  const asses=t.assignees.map(ai=>
    '<div style="display:flex;align-items:center;gap:7px;margin-bottom:5px">'+
    '<div class="ass-av" style="background:'+(members[ai]?.color||'#999')+';width:24px;height:24px;font-size:10px">'+esc(members[ai]?.name?.[0]||'?')+'</div>'+
    '<span style="font-size:13px;color:#202124">'+esc(members[ai]?.name||'')+'</span></div>').join('');
  document.getElementById('td-content').innerHTML=
    '<div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px">'+
    '<span class="task-badge badge-cat">'+esc(t.cat)+'</span>'+
    '<span class="task-badge badge-pri-'+t.pri+'">'+PRI_LABEL[t.pri]+'</span>'+
    '<span class="task-badge '+(ov?'badge-due':'badge-due ok')+'">'+(t.done?'완료':ov?'기한 초과':'진행 중')+'</span></div>'+
    '<div style="font-size:17px;font-weight:600;color:#202124;margin-bottom:14px;line-height:1.4">'+esc(t.title)+'</div>'+
    '<div style="font-size:12px;font-weight:500;color:#80868b;margin-bottom:5px">데드라인</div>'+
    '<div style="font-size:14px;color:#202124;margin-bottom:14px">'+t.due+'</div>'+
    '<div style="font-size:12px;font-weight:500;color:#80868b;margin-bottom:7px">담당자</div>'+asses+
    (t.memo?'<div style="margin-top:12px;font-size:13px;color:#202124;background:#f8f9fa;border-radius:8px;padding:12px;line-height:1.5">'+esc(t.memo)+'</div>':'');
  openModal('modal-tdetail');
}
async function deleteTask(){
  if(selTaskIdx===null)return;
  const id=tasks[selTaskIdx].id;
  tasks.splice(selTaskIdx,1);
  closeModal('modal-tdetail');
  renderTasks();renderCal();
  try{await sbDel('tasks',id);}catch(e){}
}
function openTaskModal(){
  document.getElementById('t-title').value='';
  document.getElementById('t-memo').value='';
  document.getElementById('t-due').value=fmtDate(today);
  selAssignees=[];
  document.getElementById('t-assignees').innerHTML=members.map((m,i)=>'<div class="ms-chip" id="chip-'+i+'" onclick="toggleAssignee('+i+')">'+esc(m.name)+'</div>').join('');
  openModal('modal-task');
}
function toggleAssignee(i){
  const p=selAssignees.indexOf(i);
  if(p===-1)selAssignees.push(i);else selAssignees.splice(p,1);
  members.forEach((_,j)=>{const c=document.getElementById('chip-'+j);if(c)c.classList.toggle('sel',selAssignees.includes(j));});
}
async function saveSched_task(){
  const title=document.getElementById('t-title').value.trim();
  if(!title){alert('제목을 입력해주세요');return;}
  const due=document.getElementById('t-due').value;
  if(!due){alert('데드라인을 입력해주세요');return;}
  closeModal('modal-task');
  setStatus('저장 중…','info');
  try{
    const res=await sbPost('tasks',{title,cat:document.getElementById('t-cat').value,pri:document.getElementById('t-pri').value,due_date:due,assignees:JSON.stringify(selAssignees),memo:document.getElementById('t-memo').value,done:false});
    tasks.push(parseTask(res[0]));
    renderTasks();renderCal();
    setStatus('✓ 저장됨','ok');
  }catch(e){setStatus('저장 실패: '+e.message,'err');}
}

/* ===== MEMBERS ===== */
function renderMembersPanel(){
  document.getElementById('members-grid').innerHTML=
    members.map((m,i)=>
      '<div class="member-card">'+
      '<div class="av-lg" style="background:'+m.color+'">'+esc(m.name[0])+'</div>'+
      '<div class="member-info"><div class="mn">'+esc(m.name)+'</div><div class="mr">'+esc(m.role||'직책 미입력')+'</div></div>'+
      '<button class="icon-action" onclick="openMemberModal('+i+')" title="편집">✏️</button>'+
      '<button class="icon-action danger" onclick="removeMember('+i+')" title="삭제">🗑️</button>'+
      '</div>').join('')+
    '<div class="add-member-card" onclick="openMemberModal(null)">+ 팀원 추가</div>';
}
function openMemberModal(idx){
  editMemberIdx=idx;
  mmSelColor=idx!==null?members[idx].color:COLORS[0];
  document.getElementById('mm-title').textContent=idx!==null?'팀원 편집':'팀원 추가';
  document.getElementById('mm-name').value=idx!==null?members[idx].name:'';
  document.getElementById('mm-role').value=idx!==null?(members[idx].role||''):'';
  document.getElementById('mm-swatches').innerHTML=COLORS.map(c=>'<div class="swatch'+(c===mmSelColor?' sel':'')+'" style="background:'+c+'" onclick="selectColor(\''+c+'\',this)"></div>').join('');
  openModal('modal-member');
}
function selectColor(c,el){
  mmSelColor=c;
  document.querySelectorAll('#mm-swatches .swatch').forEach(s=>s.classList.remove('sel'));
  el.classList.add('sel');
}
async function saveMember(){
  const name=document.getElementById('mm-name').value.trim();
  const role=document.getElementById('mm-role').value.trim();
  if(!name){alert('이름을 입력해주세요');return;}
  closeModal('modal-member');
  setStatus('저장 중…','info');
  try{
    if(editMemberIdx!==null){
      await sbPatch('members',members[editMemberIdx].id,{name,role,color:mmSelColor});
      members[editMemberIdx]={...members[editMemberIdx],name,role,color:mmSelColor};
    }else{
      const res=await sbPost('members',{name,role,color:mmSelColor});
      members.push(parseMember(res[0]));
    }
    setStatus('✓ 저장됨','ok');
    renderMembersPanel();renderSidebar();
  }catch(e){setStatus('저장 실패: '+e.message,'err');}
}
async function removeMember(idx){
  if(!confirm('"'+members[idx].name+'"을(를) 삭제하시겠습니까?'))return;
  const id=members[idx].id;
  schedules=schedules.filter(s=>s.memberId!==idx).map(s=>({...s,memberId:s.memberId>idx?s.memberId-1:s.memberId}));
  tasks=tasks.map(t=>({...t,assignees:t.assignees.filter(a=>a!==idx).map(a=>a>idx?a-1:a)}));
  members.splice(idx,1);
  try{await sbDel('members',id);}catch(e){}
  renderMembersPanel();renderSidebar();
}

/* ===== START ===== */
initData().then(()=>{renderSidebar();renderCal();});
</script>
